<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140706" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>H B Lane Kali Puja – Bill Search 2025 / 2026</title>
<style>
:root{--bg:#fff6e8;--card:#fffdf8;--grp:#f9ecd5;--ink:#2a1210;--mut:#7d6055;--line:rgba(120,55,30,.16);--fill:rgba(150,70,40,.10);
--cr:#a4161a;--cr2:#d62828;--gold:#f59e0b;--ok:#2e7d32;--okbg:rgba(46,125,50,.14);--due:#c62828;--duebg:rgba(198,40,40,.12);--ind:#3f3a8f;--indbg:rgba(63,58,143,.13);--goldbg:rgba(245,158,11,.2);--goldtx:#8a5200;
--glass:rgba(255,250,240,.72);--glassb:rgba(255,255,255,.7);--gshadow:0 8px 28px rgba(120,30,20,.16),inset 0 1px 0 rgba(255,255,255,.8)}
@media(prefers-color-scheme:dark){:root{--bg:#140706;--card:#241210;--grp:#321b17;--ink:#fbeee0;--mut:#c9a99a;--line:rgba(255,200,160,.16);--fill:rgba(255,190,150,.12);
--cr:#e5383b;--cr2:#ff5a5f;--gold:#ffb703;--ok:#7ad98a;--okbg:rgba(122,217,138,.16);--due:#ff8a80;--duebg:rgba(255,100,90,.18);--ind:#9d97ff;--indbg:rgba(157,151,255,.18);--goldbg:rgba(255,183,3,.2);--goldtx:#ffcf5c;
--glass:rgba(50,26,22,.68);--glassb:rgba(255,200,160,.18);--gshadow:0 8px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,190,.12)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 34% at 90% 0%,rgba(245,158,11,.22),transparent 70%),radial-gradient(60% 40% at 0% 30%,rgba(214,40,40,.14),transparent 70%),radial-gradient(70% 40% at 50% 105%,rgba(164,22,26,.14),transparent 70%)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:.5px solid var(--glassb);box-shadow:var(--gshadow)}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 130px}
input,select,button{font:inherit;color:var(--ink)}
button{cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 22px;color:#fff3dc;background:linear-gradient(135deg,#5c0a10 0%,#a4161a 55%,#d9530f 100%);box-shadow:0 10px 30px rgba(120,20,15,.3);border-bottom:4px solid var(--gold)}
.hero::after{content:"🪔";position:absolute;right:14px;top:6px;font-size:3.6rem;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.hero small{letter-spacing:.14em;font-size:.7rem;font-weight:700;color:#ffd98a}
.hero h1{margin:2px 0 0;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero p{margin:4px 0 0;font-size:.92rem;color:#ffe7c2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media(min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{border-radius:20px;padding:12px 14px;text-align:left;border:.5px solid var(--glassb);background:var(--card);box-shadow:0 1px 3px rgba(80,20,10,.08)}
.stat:active{transform:scale(.97)}
.stat span{display:block;font-size:.72rem;color:var(--mut);font-weight:600}
.stat b{display:block;font-size:1.3rem;font-weight:780;letter-spacing:-.02em;margin-top:1px}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--due)}.stat.o b{color:var(--goldtx)}.stat.i b{color:var(--ind)}
.searchbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:10}
.sbar{display:flex;align-items:center;gap:6px;border-radius:99px;padding:3px 5px 3px 15px}
.sbar>svg{flex:none;color:var(--cr)}
input[type=search]{flex:1;min-width:0;border:0;background:none;padding:13px 2px;font-size:17px;outline:none;-webkit-appearance:none}
input[type=search]::-webkit-search-cancel-button{display:none}
.clr{border:0;background:var(--fill);color:var(--mut);width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;padding:0;flex:none}
.clr[hidden]{display:none}
.go{border:0;background:var(--cr);color:#fff;border-radius:99px;padding:10px 17px;font-weight:650;font-size:15px}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:8px;border-radius:22px;overflow:hidden;display:none;max-height:55vh;overflow-y:auto;background:var(--card);box-shadow:0 16px 40px rgba(60,10,5,.3)}
.sugg div{padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;border-bottom:.5px solid var(--line)}
.sugg div:last-child{border:0}.sugg div.on,.sugg div:active{background:var(--fill)}
.sugg small{color:var(--mut)}
mark{background:rgba(245,158,11,.5);color:inherit;border-radius:4px;padding:0 1px}
.chips{display:flex;gap:8px;margin:12px -14px 2px;padding:2px 14px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:.5px solid var(--line);background:var(--card);border-radius:99px;padding:9px 16px;font-size:.9rem;font-weight:600}
.chip.on{background:var(--cr);border-color:var(--cr);color:#fff}
.info{color:var(--mut);font-size:.84rem;margin:8px 6px 10px}
.empty{text-align:center;padding:34px 18px;background:var(--card);border-radius:26px;border:1.5px dashed var(--line)}
.empty .big{font-size:2.6rem}.empty b{display:block;font-size:1.1rem;margin:6px 0 4px}.empty p{margin:0;color:var(--mut);font-size:.93rem}
.card{background:var(--card);border-radius:24px;margin-bottom:12px;box-shadow:0 1px 3px rgba(80,20,10,.08);border:.5px solid var(--line);overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:15px 16px 6px}
.ctext{flex:1;min-width:0}
.name{font-weight:720;font-size:1.1rem;letter-spacing:-.01em}
.addr{color:var(--mut);font-size:.92rem;margin-top:1px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--mut);font-size:1.2rem;transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 14px}
.pill{font-size:.76rem;font-weight:650;padding:5px 11px;border-radius:99px;background:var(--fill);color:var(--mut)}
.pill.paid{background:var(--okbg);color:var(--ok)}.pill.due{background:var(--duebg);color:var(--due)}
.pill.deliver{background:var(--goldbg);color:var(--goldtx)}.pill.issued{background:var(--indbg);color:var(--ind)}
.pill.bill{background:var(--cr);color:#fff}.pill.new{background:var(--okbg);color:var(--ok)}
.body{padding:0 16px 16px;border-top:.5px solid var(--line)}
.note{font-size:.84rem;margin-top:12px;color:var(--mut)}
.gt{font-size:.76rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 6px}
.group{background:var(--grp);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;min-height:48px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.row>span:first-child,.row>label{color:var(--mut);font-size:.95rem;flex:none}
.row input,.row select{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:17px;font-weight:650;outline:none;padding:0;-webkit-appearance:none;appearance:none}
.row input::placeholder{color:var(--mut);font-weight:400;opacity:.7}
.val{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.badge{font-size:.66rem;font-weight:750;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.b-paid{background:var(--okbg);color:var(--ok)}.b-due{background:var(--duebg);color:var(--due)}.b-na{background:var(--fill);color:var(--mut)}
.tint{width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font-weight:680;font-size:16px;background:var(--cr);color:#fff}
.tint:active{opacity:.7}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--fill);border-radius:16px;padding:3px}
.seg button{border:0;background:none;border-radius:13px;padding:13px 6px;font-weight:650;font-size:15px}
.seg .p.sel{background:var(--ok);color:#fff;box-shadow:0 2px 8px rgba(46,125,50,.4)}
.seg .d.sel{background:var(--due);color:#fff;box-shadow:0 2px 8px rgba(198,40,40,.4)}
.seg .b1.sel{background:var(--gold);color:#2a1210;box-shadow:0 2px 8px rgba(245,158,11,.5)}
.seg .b2.sel{background:var(--ind);color:#fff;box-shadow:0 2px 8px rgba(63,58,143,.4)}
.seg button:disabled{cursor:default}
.sw{position:relative;width:52px;height:32px;flex:none;display:block}
.row .sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer;flex:none;padding:0}
.sw i{position:absolute;inset:0;background:var(--fill);border-radius:99px;transition:background .2s;box-shadow:inset 0 0 0 1px var(--line)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i{background:var(--gold);box-shadow:none}.sw.ind input:checked+i{background:var(--ind)}
.sw input:checked+i::after{transform:translateX(20px)}
.row[hidden]{display:none}
.stat small{display:block;font-size:.74rem;color:var(--mut);font-weight:600;margin-top:1px}
.hint{font-size:.78rem;color:var(--mut);margin:6px 6px 0}
.arow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:14px;position:relative}
.arow+.arow::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--line)}
.arow:active{background:var(--fill)}
.arow .ai{font-size:1.5rem;width:30px;text-align:center;flex:none}
.arow b{display:block;font-size:1rem}.arow small{display:block;color:var(--mut);font-size:.8rem;margin-top:1px}
.del{background:none;border:0;color:var(--due);font-size:.92rem;font-weight:550;padding:16px 0 0;width:100%}
.more{width:100%;border:0;border-radius:16px;padding:15px;background:var(--card);color:var(--cr);font-weight:650;font-size:16px;margin-bottom:10px;border:.5px solid var(--line)}
.mode{font-size:.74rem;color:var(--mut);margin-top:20px;text-align:center}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:20;display:flex;align-items:center;gap:6px;padding:6px;border-radius:99px}
.bar button{border:0;background:none;height:48px;min-width:48px;border-radius:99px;display:grid;place-items:center;color:var(--ink);padding:0}
.bar button:active{background:var(--fill)}
.bar .add{background:var(--cr);color:#fff;padding:0 22px;font-weight:680;font-size:16px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.bar .add:active{background:var(--cr);opacity:.8}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lockBtn.on svg{color:var(--ok)}
.backdrop{position:fixed;inset:0;background:rgba(40,8,4,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0 auto;max-width:560px;max-height:94vh;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.snav{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.snav b{font-size:1.02rem}.snav button{border:0;background:none;color:var(--cr);font-size:17px;padding:6px 4px}
.snav .done{font-weight:750}
.sheet .group{background:var(--card);margin-bottom:14px;border:.5px solid var(--line)}
.asugg{background:var(--card)}
.asugg div{padding:12px 14px;border-top:.5px solid var(--line);font-size:.95rem;cursor:pointer}
.asugg div:active{background:var(--fill)}
.asugg:empty{display:none}
.dlg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(40,8,4,.45);padding:20px}
.dlg.open{display:flex}
.dbox{width:100%;max-width:300px;border-radius:26px;padding:20px 16px 14px;text-align:center;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 20px 60px rgba(40,8,4,.4)}
.dbox h3{margin:0 0 4px;font-size:1.05rem}.dbox p{margin:0 0 12px;font-size:.85rem;color:var(--mut)}
.dbox input{width:100%;border:0;background:var(--fill);border-radius:12px;padding:12px;font-size:17px;text-align:center;outline:none}
.derr{color:var(--due);font-size:.82rem;min-height:1.2em;margin:8px 0 6px}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtns button{border:0;border-radius:14px;padding:12px;font-size:16px;font-weight:600;background:var(--fill)}
.dbtns .pri{background:var(--cr);color:#fff}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%) translateY(8px);padding:11px 18px;border-radius:99px;font-size:.9rem;font-weight:550;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90vw;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><small>H B LANE</small><h1>Kali Puja</h1><p>Bills, collection &amp; bhog · 2025 &amp; 2026</p></div>
  <div class="stats">
    <button class="stat g" data-f="25paid"><span>2025 Collected</span><b id="s25p">–</b></button>
    <button class="stat r" data-f="25due"><span>2025 Due</span><b id="s25d">–</b></button>
    <button class="stat g" data-f="26paid"><span>2026 Collected</span><b id="s26p">–</b></button>
    <button class="stat r" data-f="26due"><span>2026 Due</span><b id="s26d">–</b></button>
    <button class="stat o" data-f="bhogdeliver"><span>🍚 Bhog to be delivered</span><b id="sb1">–</b></button>
    <button class="stat i" data-f="bhogissued"><span>✅ Bhog issued</span><b id="sb2">–</b><small id="sb2x"></small></button>
  </div>
  <div class="searchbox">
    <form class="sbar glass" id="f" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search name, address or bill no." aria-label="Search" enterkeyhint="search">
      <button class="clr" id="clr" type="button" hidden aria-label="Clear">✕</button>
      <button class="go" type="submit">Search</button>
    </form>
    <div class="sugg" id="sugg" role="listbox"></div>
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="26paid">2026 Paid</button>
    <button class="chip" data-f="26due">2026 Due</button>
    <button class="chip" data-f="bhogdeliver">Bhog to be delivered</button>
    <button class="chip" data-f="bhogissued">Bhog issued</button>
    <button class="chip" data-f="25paid">2025 Paid</button>
    <button class="chip" data-f="25due">2025 Due</button>
  </div>
  <div class="info" id="info"></div>
  <div id="out"></div>
  <div class="mode" id="mode"></div>
</div>

<div class="bar glass">
  <button id="lockBtn" aria-label="Editing lock"></button>
  <button class="add" id="addBtn"><span style="font-size:1.35rem;line-height:1;margin-top:-2px">+</span>Add Entry</button>
  <button id="dataBtn" aria-label="Export, backup and restore" title="Export / Backup / Restore"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></button>
</div>

<div class="backdrop" id="bd"></div>
<div class="sheet" id="addPanel" role="dialog" aria-label="New entry">
  <div class="grab"></div>
  <div class="snav"><button type="button" id="aCancel">Cancel</button><b>New Entry · 2026</b><button class="done" type="submit" form="addForm">Add</button></div>
  <form id="addForm" autocomplete="off">
    <div class="group">
      <div class="row"><label for="aName">Name</label><input id="aName" required maxlength="100" placeholder="Required" autocapitalize="characters"></div>
      <div class="row"><label for="aAddr">Address</label><input id="aAddr" maxlength="200" placeholder="Start typing…" autocapitalize="characters"></div>
      <div class="asugg" id="aSugg"></div>
    </div>
    <div class="group">
      <div class="row"><label for="aBill">Bill no.</label><input id="aBill" maxlength="20" placeholder="2026 bill no."></div>
      <div class="row"><label for="aAmt">Amount (₹)</label><input id="aAmt" type="number" min="0" step="any" inputmode="decimal" required placeholder="Required"></div>
      <div class="row"><label for="aSt">Payment</label><select id="aSt" dir="rtl"><option value="paid">Paid</option><option value="due">Due</option></select></div>
      <div class="row"><label for="aBhD">Bhog to be delivered</label><label class="sw"><input type="checkbox" id="aBhD"><i></i></label></div>
      <div class="row"><label for="aBhI">Bhog issued</label><label class="sw ind"><input type="checkbox" id="aBhI"><i></i></label></div>
      <div class="row" id="aBoxRow" hidden><label for="aBoxes">Boxes issued</label><input id="aBoxes" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="How many?"></div>
    </div>
  </form>
</div>

<div class="sheet" id="dataPanel" role="dialog" aria-label="Export, backup and restore">
  <div class="grab"></div>
  <div class="snav"><span style="width:60px"></span><b>Data</b><button class="done" type="button" id="dClose">Done</button></div>
  <div class="group">
    <button class="arow" id="dExport" type="button"><span class="ai">📄</span><span><b>Export 2026 list</b><small>CSV with SL No, Name, Address, Amount, Payment status</small></span></button>
    <button class="arow" id="dBackup" type="button"><span class="ai">💾</span><span><b>Backup 2026 data</b><small>Downloads a backup file with everything saved for 2026</small></span></button>
    <button class="arow" id="dRestore" type="button"><span class="ai">♻️</span><span><b>Restore from backup</b><small>Pick a backup file · replaces all current 2026 data</small></span></button>
  </div>
  <div class="hint" id="dInfo"></div>
  <input type="file" id="dFile" accept=".json,application/json" hidden>
</div>

<div class="dlg" id="dlg"><form class="dbox" id="pinForm" autocomplete="off">
  <h3>Admin PIN</h3><p>Enter the PIN to enable editing. You'll only need to do this once on this device.</p>
  <input type="password" id="pinIn" inputmode="text" placeholder="PIN" autocomplete="off">
  <div class="derr" id="pinErr"></div>
  <div class="dbtns"><button type="button" id="pinCancel">Cancel</button><button type="submit" class="pri">Unlock</button></div>
</form></div>
