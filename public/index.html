<html lang="en">
<head>

<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1b18;--mut:#78746c;--line:#ebe7df;--acc:#c62828;--acc2:#e65100;--ok:#14803c;--okbg:#e3f5e9;--due:#c62828;--duebg:#fde9e8;--na:#78746c;--nabg:#f0ede7;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(60,40,20,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#121110;--card:#1e1d1b;--ink:#f3f1ec;--mut:#a09c92;--line:#322f2b;--acc:#ff7a70;--acc2:#ffa040;--ok:#6fd48c;--okbg:#15301d;--due:#ff8a80;--duebg:#3a1c1a;--na:#a09c92;--nabg:#2a2825;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.hero{background:linear-gradient(135deg,#b3261e,#e65100);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 64px}
.hero-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.3rem;margin:0;letter-spacing:-.01em}.sub{opacity:.85;font-size:.85rem;margin-top:2px}
.ibtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:1.15rem;display:grid;place-items:center;padding:0;cursor:pointer;backdrop-filter:blur(6px)}
.wrap{max-width:760px;margin:-46px auto 0;padding:0 14px 110px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat b{display:block;font-size:1.15rem;margin-top:2px}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--due)}
.searchbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:10}
.sbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:4px 6px 4px 14px;box-shadow:var(--shadow);border:1.5px solid transparent}
.sbar:focus-within{border-color:var(--acc)}
.sbar svg{flex:none;color:var(--mut)}
input,select,button{font:inherit;color:var(--ink)}
input[type=search]{flex:1;min-width:0;border:0;background:none;padding:12px 4px;font-size:1rem;outline:none;-webkit-appearance:none}
.go{border:0;background:var(--acc);color:#fff;border-radius:13px;padding:10px 16px;font-weight:650;cursor:pointer}
@media(prefers-color-scheme:dark){.go,.primary{color:#171614}}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.22);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
.sugg div{padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.sugg div:last-child{border:0}.sugg div.on,.sugg div:hover{background:var(--nabg)}
.sugg small{color:var(--mut)}
mark{background:#ffe08a;color:#000;border-radius:3px;padding:0 1px}
.chips{display:flex;gap:8px;margin:14px -14px 6px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:99px;padding:8px 14px;font-size:.84rem;font-weight:600;color:var(--mut);box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.info{color:var(--mut);font-size:.82rem;margin:8px 4px 10px}
.res{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:1.05rem;letter-spacing:-.005em}
.addr{color:var(--mut);font-size:.9rem;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:.72rem;font-weight:650;background:var(--nabg);color:var(--mut);padding:3px 10px;border-radius:99px}
.tag.bill{background:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.tag.bill{color:#171614}}
.tag.new{background:var(--okbg);color:var(--ok)}
.note{font-size:.82rem;margin-top:8px;color:var(--mut)}
.sec{border-radius:14px;padding:12px;margin-top:10px;background:var(--nabg)}
.sec.y26{background:transparent;border:1.5px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.amt{font-weight:750;font-size:1.25rem}
.badge{display:inline-block;font-size:.68rem;font-weight:750;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.b-paid{background:var(--okbg);color:var(--ok)}.b-due{background:var(--duebg);color:var(--due)}.b-na{background:var(--card);color:var(--na)}
.y26 .b-na{background:var(--nabg)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.fld label{display:block;font-size:.72rem;color:var(--mut);font-weight:600;margin-bottom:4px}
.fld input,.fld select{width:100%;min-width:0;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:650;font-size:1rem;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.fld.full{grid-column:1/-1}
.savebtn{grid-column:1/-1;border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;font-weight:650;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 6px;font-weight:650;cursor:pointer}
.seg .p.sel{background:var(--ok);border-color:var(--ok);color:#fff}.seg .d.sel{background:var(--due);border-color:var(--due);color:#fff}
.seg button:disabled{cursor:default}
.del{background:none;border:0;color:var(--due);font-size:.82rem;padding:12px 0 0;text-decoration:underline;cursor:pointer}
.mode{font-size:.74rem;color:var(--mut);margin-top:20px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:56px;padding:0 20px;border-radius:28px;border:0;background:linear-gradient(135deg,#c62828,#e65100);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 8px 24px rgba(198,40,40,.4);cursor:pointer;z-index:20;display:flex;align-items:center;gap:6px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:.2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 12px;font-size:1.1rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtns{display:flex;gap:8px;margin-top:6px}
.fbtns button{flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:650;cursor:pointer}
.fbtns .primary{background:var(--acc);border-color:var(--acc);color:#fff;flex:2}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90vw;z-index:50}
.toast.show{opacity:1}
</style>
</head>

"},{"cn":292,"name":"SHANTANU GHOSH - RAJA","addr":"19 HB LANE","amt":2000,"st":"paid","note":"500 DUE","book":"Book 6 (MEMBERSHIP)"},{"cn":293,"name":"SUDIP DAS - BURO","addr":"26 HB LANE","amt":1000,"st":"due","note":"","book":"Book 6 (MEMBERSHIP)"},{"cn":294,"name":"DEBASHISH MUKHERJEE - MASTER","addr":"27F HB LANE","amt":7000,"st":"due","note":"","book":"Book 6 (MEMBERSHIP)"},{"cn":295,"name":"RAJIB GHOSH - TATTU","addr":"4 HB LANE","amt":2300,"st":"due","note":"","book":"Book 6 (MEMBERSHIP)"},{"cn":296,"name":"DAMU DA","addr":"136 A P ROAD","amt":2000,"st":"paid","note":"","book":"Book 6 (MEMBERSHIP)"},{"cn":297,"name":"DEBKUMAR DUTTA","addr":"3/1B H B LANE","amt":2000,"st":"paid","note":"","book":"Book 6 (MEMBERSHIP)"}];
const API = "/api/status", LSKEY = "kalipuja2026-state";
const BASE = DATA.map(r => ({ id: String(r.cn), cn: r.cn, name: r.name, addr: r.addr, amt25: r.amt, st25: r.st, note: r.note, book: r.book, manual: false }));
let S = { rec: {}, manual: [] }, shared = false, filter = "all", pin = sessionStorage.getItem("kp-pin") || "";
const $ = id => document.getElementById(id);
const rs = n => "₹" + Number(n).toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const items = () => BASE.concat(S.manual.map(m => ({ id: m.id, cn: null, name: m.name, addr: m.addr || "", amt25: null, st25: null, note: "", book: "Manual entry", manual: true })));
const r26 = r => S.rec[r.id] || {};
const LBL = { paid: "PAID", due: "DUE", na: "N/A" };
const hl = (t, q) => {
  const e = esc(t); if (!q) return e;
  const i = t.toLowerCase().indexOf(q); if (i < 0) return e;
  return esc(t.slice(0,i)) + "<mark>" + esc(t.slice(i,i+q.length)) + "</mark>" + esc(t.slice(i+q.length));
};
function match(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  return items().filter(r => { const h = (r.name + " " + r.addr + " " + (r.cn ?? "") + " " + r.note + " " + (r26(r).bill || "")).toLowerCase(); return toks.every(t => h.includes(t)); });
}
function stats() {
  let a = 0, b = 0, c = 0, d = 0;
  items().forEach(r => {
    if (r.st25 === "paid") a += r.amt25; else if (r.st25 === "due") b += r.amt25;
    const x = r26(r); if (x.status === "paid") c += x.amt || 0; else if (x.status === "due") d += x.amt || 0;
  });
  $("s25p").textContent = rs(a); $("s25d").textContent = rs(b); $("s26p").textContent = rs(c); $("s26d").textContent = rs(d);
}
function passes(r) {
  const x = r26(r);
  switch (filter) {
    case "25paid": return r.st25 === "paid"; case "25due": return r.st25 === "due";
    case "26paid": return x.status === "paid"; case "26due": return x.status === "due";
    case "26none": return !x.status; case "26nobill": return !x.bill; default: return true;
  }
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  let list = (q ? match(q) : items()).filter(passes);
  if (!q && filter === "all") { $("info").textContent = "Type to search " + items().length + " entries"; $("out").innerHTML = ""; return; }
  $("info").textContent = list.length + " result" + (list.length === 1 ? "" : "s") + (list.length > 60 ? " (showing first 60)" : "");
  const keep = document.activeElement && document.activeElement.dataset ? (document.activeElement.dataset.bill || document.activeElement.dataset.amt) : null;
  $("out").innerHTML = list.slice(0, 60).map(r => {
    const x = r26(r), s = x.status || "", s25 = r.st25;
    return `<div class="res"><div class="top"><div><div class="name">${hl(r.name,q)}</div><div class="addr">${hl(r.addr,q)}</div></div></div>
      <div class="tags">${r.manual ? '<span class="tag new">NEW · 2026</span>' : `<span class="tag">2025 Bill #${r.cn}</span><span class="tag">${esc(r.book)}</span>`}${x.bill ? `<span class="tag bill">2026 Bill #${hl(x.bill,q)}</span>` : ""}</div>
      ${r.note ? `<div class="note">2025 note: ${esc(r.note)}</div>` : ""}
      <div class="sec"><div class="sh"><span>2025 🔒</span>${s25 ? `<span class="badge b-${s25}">${LBL[s25]}</span>` : ""}</div>
        <div class="amt">${r.amt25 == null ? "—" : rs(r.amt25)}</div></div>
      <div class="sec y26"><div class="sh"><span>2026</span>${s ? `<span class="badge b-${s}">${LBL[s]}</span>` : '<span class="badge b-na">NOT MARKED</span>'}</div>
        <div class="fields">
          <div class="fld"><label>Bill no.</label><input type="text" maxlength="20" placeholder="Add bill no." data-bill="${r.id}" value="${esc(x.bill || "")}"></div>
          <div class="fld"><label>Amount (₹)</label><input type="number" min="0" step="any" inputmode="decimal" placeholder="Amount" data-amt="${r.id}" value="${x.amt ?? ""}"></div>
          <button class="savebtn" data-save="${r.id}">Save bill no. &amp; amount</button>
        </div>
        <div class="seg"><button class="p ${s==="paid"?"sel":""}" data-id="${r.id}" data-s="paid" ${s==="paid"?"disabled":""}>✓ Mark Paid</button>
        <button class="d ${s==="due"?"sel":""}" data-id="${r.id}" data-s="due" ${s==="due"?"disabled":""}>✗ Mark Due</button></div>
      </div>${r.manual ? `<button class="del" data-del="${r.id}">Delete this entry</button>` : ""}</div>`;
  }).join("");
}
/* autocomplete */
let sel = -1, sugg = [];
function showSugg() {
  const q = $("q").value.trim().toLowerCase(), box = $("sugg");
  if (!q) { box.style.display = "none"; return; }
  sugg = match(q).slice(0, 8); sel = -1;
  box.innerHTML = sugg.map((r,i) => `<div data-i="${i}"><span>${hl(r.name,q)}</span><small>${hl(r.addr,q)}</small></div>`).join("");
  box.style.display = sugg.length ? "block" : "none";
}
function pick(i) { $("q").value = sugg[i].name; $("sugg").style.display = "none"; render(); }
$("q").addEventListener("input", () => { showSugg(); render(); });
$("q").addEventListener("keydown", e => {
  const it = $("sugg").children; if ($("sugg").style.display !== "block") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + it.length) % it.length;
    [...it].forEach((el,i) => el.classList.toggle("on", i === sel));
  } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); pick(sel); }
  else if (e.key === "Escape") $("sugg").style.display = "none";
});
$("sugg").addEventListener("mousedown", e => { const d = e.target.closest("[data-i]"); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
document.addEventListener("click", e => { if (!e.target.closest(".searchbox")) $("sugg").style.display = "none"; });
$("f").addEventListener("submit", e => { e.preventDefault(); $("sugg").style.display = "none"; $("q").blur(); render(); });
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return; filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); render();
});
/* actions (2026 only) */
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function saveLocal() { try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) {} }
const okAmt = v => typeof v === "number" && isFinite(v) && v >= 0 && v <= 1e9;
const cleanBill = v => String(v == null ? "" : v).trim().slice(0, 20);
function applyLocal(p) {
  if (p.action === "set") {
    const x = S.rec[p.id] = S.rec[p.id] || {};
    if (p.status) x.status = p.status;
    if (p.amt !== undefined) x.amt = p.amt;
    if (p.bill !== undefined) { const b = cleanBill(p.bill); if (b) x.bill = b; else delete x.bill; }
  } else if (p.action === "add") {
    const e = p.entry; S.manual.push({ id: e.id, name: e.name, addr: e.addr });
    S.rec[e.id] = { status: e.status, amt: e.amt };
    const b = cleanBill(e.bill); if (b) S.rec[e.id].bill = b;
  } else if (p.action === "delete") {
    S.manual = S.manual.filter(m => m.id !== p.id); delete S.rec[p.id];
  }
}
function norm(s) { return { rec: (s && s.rec) || {}, manual: (s && s.manual) || [] }; }
async function act(p, okMsg) {
  const before = JSON.stringify(S);
  applyLocal(p); stats(); render();
  const send = () => fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...p, pin }) });
  try {
    if (!shared) throw new Error("local");
    let r = await send();
    if (r.status === 401) {
      pin = prompt("Enter admin PIN to make changes:") || ""; sessionStorage.setItem("kp-pin", pin); r = await send();
      if (r.status === 401) { sessionStorage.removeItem("kp-pin"); pin = ""; S = JSON.parse(before); stats(); render(); return toast("Wrong PIN – not saved"); }
    }
    if (!r.ok) throw new Error("fail");
    S = norm(await r.json()); stats(); render(); toast(okMsg + " (saved for everyone)");
  } catch (e) { saveLocal(); toast(okMsg + " (this device only)"); }
}
$("out").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.s && !b.disabled) act({ action: "set", id: b.dataset.id, status: b.dataset.s }, "2026 marked " + b.dataset.s.toUpperCase());
  else if (b.dataset.save) saveEdit(b.dataset.save);
  else if (b.dataset.del && confirm("Delete this manual entry?")) act({ action: "delete", id: b.dataset.del }, "Entry deleted");
});
$("out").addEventListener("keydown", e => { const id = e.target.dataset && (e.target.dataset.amt || e.target.dataset.bill); if (e.key === "Enter" && id) { e.preventDefault(); saveEdit(id); } });
function saveEdit(id) {
  const bi = document.querySelector(`input[data-bill="${id}"]`), ai = document.querySelector(`input[data-amt="${id}"]`);
  const bill = cleanBill(bi.value), had = (S.rec[id] || {}).bill || "";
  const p = { action: "set", id }, parts = [];
  if (bill !== had) { p.bill = bill; parts.push(bill ? "bill no. " + bill : "bill no. cleared"); }
  if (ai.value.trim() !== "") {
    const v = parseFloat(ai.value);
    if (!okAmt(v)) return toast("Enter a valid amount");
    if (v !== (S.rec[id] || {}).amt) { p.amt = v; parts.push("amount " + rs(v)); }
  }
  if (!parts.length) return toast("Nothing changed");
  act(p, "2026 " + parts.join(" & ") + " saved");
}
/* add entry */
const openSheet = o => { $("addPanel").classList.toggle("open", o); $("bd").classList.toggle("open", o); if (o) setTimeout(() => $("aName").focus(), 250); };
$("addBtn").onclick = () => openSheet(true);
$("bd").onclick = () => openSheet(false);
$("aCancel").onclick = () => { openSheet(false); $("addForm").reset(); };
$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("aName").value.trim(), amt = parseFloat($("aAmt").value);
  if (!name) return toast("Name is required");
  if (!okAmt(amt)) return toast("Enter a valid amount");
  const entry = { id: "m" + Date.now() + Math.floor(Math.random() * 900 + 100), name, addr: $("aAddr").value.trim(), amt, status: $("aSt").value, bill: cleanBill($("aBill").value) };
  act({ action: "add", entry }, "Entry added");
  $("addForm").reset(); openSheet(false);
  filter = "all"; document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.f === "all"));
  $("q").value = name; showSugg(); $("sugg").style.display = "none"; render();
});
/* export */
function csvCell(v) {
  v = v == null ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(v) && isNaN(Number(v))) v = "'" + v;
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
$("expBtn").onclick = () => {
  const head = ["2025 Bill No","Book","Name","Address","2025 Amount (Rs)","2025 Status","2025 Note","2026 Bill No","2026 Amount (Rs)","2026 Status","Entry Type"];
  const rows = items().map(r => { const x = r26(r); return [r.cn ?? "", r.manual ? "" : r.book, r.name, r.addr, r.amt25 ?? "", r.st25 ? LBL[r.st25] : "", r.note, x.bill ?? "", x.amt ?? "", x.status ? LBL[x.status] : "", r.manual ? "Manual (2026)" : "Original"]; });
  const csv = "\ufeff" + [head].concat(rows).map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "kalipuja_2025_2026_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Exported " + rows.length + " entries");
};
/* init */
(async function () {
  try { S = norm(JSON.parse(localStorage.getItem(LSKEY) || "{}")); } catch (e) {}
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (r.ok && (r.headers.get("content-type") || "").includes("json")) { const j = await r.json(); if (j && j.rec) { S = norm(j); shared = true; } }
  } catch (e) {}
  $("mode").textContent = shared ? "2026 changes are saved online and visible to everyone. 2025 data is read-only." : "2026 changes are saved on this device only (shared sync not enabled). 2025 data is read-only.";
  stats(); render();
})();
