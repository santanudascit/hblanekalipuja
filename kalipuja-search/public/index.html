<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H B Lane Kali Puja 2025 – Bill Search</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mut:#6b6860;--line:#e4e0d6;--acc:#b3261e;--ok:#1b7f3b;--okbg:#e4f4e8;--due:#b3261e;--duebg:#fdeceb;--na:#6b6860;--nabg:#eee}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--card:#222120;--ink:#f1efe9;--mut:#a29f95;--line:#37352f;--acc:#ff8a80;--ok:#6fd48c;--okbg:#17301f;--due:#ff8a80;--duebg:#3a1b19;--na:#a29f95;--nabg:#2c2b28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.35rem;margin:0 0 2px}.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:1.05rem}.stat span{font-size:.75rem;color:var(--mut)}
.searchbox{position:relative}
.row{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){button.primary{color:#171614}}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:5;overflow:hidden;display:none}
.sugg div{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sugg div:last-child{border:0}.sugg div.on,.sugg div:hover{background:var(--nabg)}
.sugg small{color:var(--mut)}
mark{background:#ffe08a;color:#000;border-radius:2px;padding:0 1px}
.chips{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:99px;font-size:.85rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.info{color:var(--mut);font-size:.85rem;margin:6px 2px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:650}.addr{color:var(--mut);font-size:.92rem}
.amt{font-weight:700;font-size:1.1rem;white-space:nowrap}
.meta{font-size:.78rem;color:var(--mut);margin-top:4px}
.note{font-size:.82rem;margin-top:6px;color:var(--mut)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.b-paid{background:var(--okbg);color:var(--ok)}.b-due{background:var(--duebg);color:var(--due)}.b-na{background:var(--nabg);color:var(--na)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;font-weight:600}
.act .p.sel{background:var(--ok);border-color:var(--ok);color:#fff}.act .d.sel{background:var(--due);border-color:var(--due);color:#fff}
.act button:disabled{opacity:.6;cursor:default}
.mode{font-size:.75rem;color:var(--mut);margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>H B Lane Kali Puja 2025</h1>
  <div class="sub">Bill &amp; collection search</div>

    <div class="stat"><b id="sCnt">–</b><span>Bills</span></div>

  <div class="searchbox">
    <form class="row" id="f" autocomplete="off">
      <input type="search" id="q" placeholder="Search name, address or bill no…" aria-label="Search" autofocus>
      <button class="primary" type="submit">Search</button>
    </form>
    <div class="sugg" id="sugg" role="listbox"></div>

  <div class="chips" id="chips">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="paid">Paid</button>
    <button class="chip" data-f="due">Due</button>
  </div>
  <div class="info" id="info"></div>
  <div id="out"></div>
  <div class="mode" id="mode"></div>
</div>
<div class="toast" id="toast"></div>

    return `<div class="res"><div class="top"><div><div class="name">${hl(r.name,q)}<span class="badge b-${s}">${lbl}</span></div>
      <div class="addr">${hl(r.addr,q)}</div></div><div class="amt">${rs(r.amt)}</div></div>
      <div class="meta">Bill #${r.cn} · ${esc(r.book)}</div>${r.note ? `<div class="note">Note: ${esc(r.note)}</div>` : ""}
      <div class="act"><button class="p ${s==="paid"?"sel":""}" data-cn="${r.cn}" data-s="paid" ${s==="paid"?"disabled":""}>✓ Mark Paid</button>
      <button class="d ${s==="due"?"sel":""}" data-cn="${r.cn}" data-s="due" ${s==="due"?"disabled":""}>✗ Mark Due</button></div></div>`;
  }).join("");
}
/* autocomplete dropdown */
let sel = -1, sugg = [];
function showSugg() {
  const q = $("q").value.trim().toLowerCase(), box = $("sugg");
  if (!q) { box.style.display = "none"; return; }
  sugg = match(q).slice(0, 8); sel = -1;
  box.innerHTML = sugg.map((r,i) => `<div data-i="${i}"><span>${hl(r.name,q)}</span><small>${hl(r.addr,q)}</small></div>`).join("");
  box.style.display = sugg.length ? "block" : "none";
}
function pick(i) { $("q").value = sugg[i].name; $("sugg").style.display = "none"; render(); }
$("q").addEventListener("input", () => { showSugg(); render(); });
$("q").addEventListener("keydown", e => {
  const items = $("sugg").children; if ($("sugg").style.display !== "block") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    [...items].forEach((el,i) => el.classList.toggle("on", i === sel));
  } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); pick(sel); }
  else if (e.key === "Escape") $("sugg").style.display = "none";
});
$("sugg").addEventListener("mousedown", e => { const d = e.target.closest("[data-i]"); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
document.addEventListener("click", e => { if (!e.target.closest(".searchbox")) $("sugg").style.display = "none"; });
$("f").addEventListener("submit", e => { e.preventDefault(); $("sugg").style.display = "none"; render(); });
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return; filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); render();
});
/* paid / due */
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
function saveLocal() { try { localStorage.setItem(LSKEY, JSON.stringify(over)); } catch (e) {} }
async function setStatus(cn, status) {
  const prev = over[cn]; over[cn] = { status, ts: Date.now() }; stats(); render();
  const send = () => fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cn, status, pin }) });
  try {
    if (!shared) throw new Error("local");
    let r = await send();
    if (r.status === 401) {
      pin = prompt("Enter admin PIN to change status:") || ""; sessionStorage.setItem("kp-pin", pin); r = await send();
      if (r.status === 401) { sessionStorage.removeItem("kp-pin"); pin = ""; if (prev) over[cn] = prev; else delete over[cn]; stats(); render(); return toast("Wrong PIN – not saved"); }
    }
    if (!r.ok) throw new Error("fail");
    over = await r.json(); stats(); render(); toast("Marked " + status.toUpperCase() + " for everyone");
  } catch (e) { saveLocal(); toast("Marked " + status.toUpperCase() + " (this device only)"); }
}
$("out").addEventListener("click", e => { const b = e.target.closest("button[data-cn]"); if (b && !b.disabled) setStatus(+b.dataset.cn, b.dataset.s); });
/* init */
(async function () {
  try { over = JSON.parse(localStorage.getItem(LSKEY) || "{}"); } catch (e) { over = {}; }
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (r.ok && (r.headers.get("content-type") || "").includes("json")) { over = await r.json(); shared = true; }
  } catch (e) {}
  $("mode").textContent = shared ? "Status changes are saved online and visible to everyone." : "Status changes are saved on this device only (shared sync not enabled).";
  stats(); render();
})();
</script>
